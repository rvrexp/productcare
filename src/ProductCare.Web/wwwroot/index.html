<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProductCare AI</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="lib/bootstrap-icons/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/productcare.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="ProductCare.Web.styles.css" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="text-center mt-5" role="status" aria-live="polite">
            <svg class="loading-progress">
                <circle r="40%" cx="50%" cy="50%" />
                <circle r="40%" cx="50%" cy="50%" />
            </svg>

            <div class="loading-progress-text"></div>
            <div class="mt-3 text-muted">Loading ProductCare AI...</div>
        </div>
    </div>

    <div id="blazor-error-ui">
        ProductCare encountered an unexpected error.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="js/productcare.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="_content/Microsoft.Authentication.WebAssembly.Msal/AuthenticationService.js"></script>
</body>

</html>
