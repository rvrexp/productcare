name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

env:
  Foundry__RouterDeployment: ${{ vars.FOUNDRY__ROUTERDEPLOYMENT }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Validate Foundry test configuration
        run: test -n "$Foundry__RouterDeployment" || { echo "Foundry RouterDeployment is not configured."; exit 1; }

      - name: Test
        run: dotnet test --configuration Release --no-build