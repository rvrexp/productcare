name: Deploy ProductCare API

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/ProductCare.Api/**'
      - 'src/ProductCare.Application/**'
      - 'src/ProductCare.AI/**'
      - 'src/ProductCare.Infrastructure/**'
      - 'src/Dockerfile'
      - '.config/dotnet-tools.json'
      - '.github/workflows/deploy-api.yml'

  push:
    branches:
      - main
    paths:
      - 'src/ProductCare.Api/**'
      - 'src/ProductCare.Application/**'
      - 'src/ProductCare.AI/**'
      - 'src/ProductCare.Infrastructure/**'
      - 'src/Dockerfile'
      - '.config/dotnet-tools.json'
      - '.github/workflows/deploy-api.yml'

permissions:
  id-token: write
  contents: read

env:
  ASPNETCORE_ENVIRONMENT: Production
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore local .NET tools
        run: dotnet tool restore

      - name: Restore API
        run: dotnet restore src/ProductCare.Api/ProductCare.Api.csproj

      - name: Validate EF Core model
        run: dotnet ef migrations has-pending-model-changes --project src/ProductCare.Infrastructure/ProductCare.Infrastructure.csproj --startup-project src/ProductCare.Api/ProductCare.Api.csproj

      - name: Build EF migration bundle
        run: |
          mkdir -p artifacts
          dotnet ef migrations bundle --project src/ProductCare.Infrastructure/ProductCare.Infrastructure.csproj --startup-project src/ProductCare.Api/ProductCare.Api.csproj --output ./artifacts/efbundle --self-contained --target-runtime linux-x64

      - name: Validate deployment configuration
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          AZURE_ACR_LOGIN_SERVER: ${{ vars.AZURE_ACR_LOGIN_SERVER }}
          AZURE_CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          PRODUCTCARE_MIGRATION_CONNECTION_STRING: ${{ secrets.PRODUCTCARE_MIGRATION_CONNECTION_STRING }}
        run: |
          test -n "$AZURE_CLIENT_ID" || { echo "AZURE_CLIENT_ID is not configured."; exit 1; }
          test -n "$AZURE_TENANT_ID" || { echo "AZURE_TENANT_ID is not configured."; exit 1; }
          test -n "$AZURE_SUBSCRIPTION_ID" || { echo "AZURE_SUBSCRIPTION_ID is not configured."; exit 1; }
          test -n "$AZURE_ACR_NAME" || { echo "AZURE_ACR_NAME is not configured."; exit 1; }
          test -n "$AZURE_ACR_LOGIN_SERVER" || { echo "AZURE_ACR_LOGIN_SERVER is not configured."; exit 1; }
          test -n "$AZURE_CONTAINER_APP_NAME" || { echo "AZURE_CONTAINER_APP_NAME is not configured."; exit 1; }
          test -n "$AZURE_RESOURCE_GROUP" || { echo "AZURE_RESOURCE_GROUP is not configured."; exit 1; }
          test -n "$PRODUCTCARE_MIGRATION_CONNECTION_STRING" || { echo "PRODUCTCARE_MIGRATION_CONNECTION_STRING is not configured."; exit 1; }

      - name: Azure login
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps extension
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: az extension add --name containerapp --upgrade --only-show-errors

      - name: Sign in to Azure Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: az acr login --name "${{ vars.AZURE_ACR_NAME }}"

      - name: Build API container image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker build -f src/Dockerfile -t "${{ vars.AZURE_ACR_LOGIN_SERVER }}/productcare-api:${{ github.sha }}" src

      - name: Push API container image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push "${{ vars.AZURE_ACR_LOGIN_SERVER }}/productcare-api:${{ github.sha }}"

      - name: Apply database migrations
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PRODUCTCARE_MIGRATION_CONNECTION_STRING: ${{ secrets.PRODUCTCARE_MIGRATION_CONNECTION_STRING }}
        run: |
          chmod +x ./artifacts/efbundle
          ./artifacts/efbundle --connection "$PRODUCTCARE_MIGRATION_CONNECTION_STRING"

      - name: Configure Container App registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: az containerapp registry set --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --server "${{ vars.AZURE_ACR_LOGIN_SERVER }}" --identity system

      - name: Deploy API
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: az containerapp update --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --image "${{ vars.AZURE_ACR_LOGIN_SERVER }}/productcare-api:${{ github.sha }}"