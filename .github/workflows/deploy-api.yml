name: Deploy ProductCare API

on:
  push:
    branches:
      - main
    paths:
      - 'src/ProductCare.Api/**'
      - 'src/ProductCare.Application/**'
      - 'src/ProductCare.AI/**'
      - 'src/ProductCare.Infrastructure/**'
      - 'src/Dockerfile'
      - '.github/workflows/deploy-api.yml'

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps CLI extension
        run: az extension add --name containerapp --upgrade --only-show-errors

      - name: Sign in to Azure Container Registry
        run: az acr login --name "${{ vars.AZURE_ACR_NAME }}"

      - name: Build ProductCare API image
        run: docker build -f src/Dockerfile -t "${{ vars.AZURE_ACR_LOGIN_SERVER }}/productcare-api:${{ github.sha }}" src

      - name: Push ProductCare API image
        run: docker push "${{ vars.AZURE_ACR_LOGIN_SERVER }}/productcare-api:${{ github.sha }}"

      - name: Configure Container App registry authentication
        run: az containerapp registry set --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --server "${{ vars.AZURE_ACR_LOGIN_SERVER }}" --identity system

      - name: Deploy ProductCare API image
        run: az containerapp update --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --image "${{ vars.AZURE_ACR_LOGIN_SERVER }}/productcare-api:${{ github.sha }}"